[project]
name = "tank-game"
version = "0.1.0"
description = "Lightweight 2-player tank game using Pygame with optional LAN play via UDP multicast."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Carlos Valente", email = "cfmvcarlos@gmail.com" }]
license = { text = "MIT" }
keywords = ["pygame", "game", "multiplayer", "lan", "tanks"]
dependencies = ["pygame>=2.6.0"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Arcade",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/cfmvcarlos/tank_game"
Repository = "https://github.com/cfmvcarlos/tank_game.git"
Issues = "https://github.com/cfmvcarlos/tank_game/issues"

[dependency-groups]
dev = [
    "pytest~=9.0.0",       # Testing framework
    "pytest-cov~=7.0.0",   # Coverage plugin for pytest
    "mypy~=1.18.0",        # Static type checker
    "ruff~=0.14.0",        # Fast Python linter
    "pydoclint~=0.8.0",    # Docstring linter
    "pytest-xdist~=3.8.0", # Parallel test execution
    "ty>=0.0.86",          # Astral type checker
]

[tool.ruff]
line-length = 88
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY",     # Missing copyright header
    "FIX",     # TODO/FIXME comments
    "TD",      # TODO formatting
    "COM812",  # Trailing comma (conflicts with ruff formatter)
    "ISC001",  # Implicit string concatenation (conflicts with ruff formatter)
    "S311",    # Pseudo-random numbers in game logic
    "S104",    # Possible binding to all interfaces for multicast socket
    "FBT",     # Boolean trap in positional parameters
    "PLR2004", # Magic value used in comparison
    "PLR0913", # Too many arguments in function definition
    "PLR0917", # Too many positional arguments
    "ANN401",  # Dynamically typed expressions (Any)
    "TC",      # Type-checking import blocks
    "PLR6301", # Method could be staticmethod
    "N816",    # MixedCase global aliases for backward compatibility
]
pydocstyle.convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "D", "ANN"]
"tank_game/game.py" = ["C901", "PLR0912", "PLR0914", "PLR0915"]

[tool.mypy]
files = ["tank_game", "tests"]
exclude = ["^build/", "^dist/"]
python_version = "3.13"
disallow_any_generics = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
strict = true
show_error_context = true
show_column_numbers = true
pretty = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage]
run.branch = true
run.relative_files = true
report.fail_under = 80
report.show_missing = true
report.skip_covered = true
report.sort = "cover"

[tool.pydoclint]
style = "numpy"
exclude = '\.git|\.tox|\.venv|build|dist|\.uv-cache|\.mypy_cache|\.ruff_cache|tests'
skip-checking-short-docstrings = false
check-style-mismatch = true
check-arg-defaults = false
show-filenames-in-every-violation-message = true
check-class-attributes = false
