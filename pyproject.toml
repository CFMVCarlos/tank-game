[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tank-game"
version = "0.1.0"
description = "Lightweight 2-player tank game using Pygame with optional LAN play via UDP multicast."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Carlos Valente", email = "cfmvcarlos@gmail.com" }]
license = { text = "MIT" }
keywords = ["pygame", "game", "multiplayer", "lan", "tanks"]
dependencies = ["pygame>=2.6.0"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Arcade",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/cfmvcarlos/tank_game"
Repository = "https://github.com/cfmvcarlos/tank_game.git"
Issues = "https://github.com/cfmvcarlos/tank_game/issues"

[project.scripts]
tank-game = "tank_game.__main__:run_launcher"

[dependency-groups]
dev = [
    "basedpyright>=1.28.0",
    "pydoclint>=0.6.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "ty>=0.0.86",
    "gitlint-core>=0.19.1",
]

[tool.ruff]
line-length = 88
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY",      # Missing copyright notice
    "FIX",      # TODO/FIXME markers
    "TD",       # TODO issues
    "COM812",   # Conflicts with ruff formatter
    "S311",     # Non-cryptographic standard pseudo-random generators (used for gameplay/particles)
    "PLR2004",  # Magic values (frequent in games for coordinate math and visual constants)
    "FBT001",   # Boolean-typed positional argument in function definition
    "FBT002",   # Boolean default positional argument in function definition
    "FBT003",   # Boolean positional value in function call (e.g. font.render antialias=True)
]
pydocstyle.convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SLF001", "ANN201", "D103"]
"src/tank_game/fsm.py" = ["ANN401", "PLR6301"]
"src/tank_game/input_handler.py" = ["ANN401", "PLR6301"]
"src/tank_game/game.py" = ["C901", "PLR0912", "PLR0913", "PLR0914", "PLR0915", "PLR0917", "ANN401"]
"src/tank_game/network.py" = ["N816"]
"src/tank_game/particles.py" = ["PLR0913", "PLR0917", "TC003"]
"src/tank_game/tank.py" = ["ANN401"]

[tool.pydoclint]
exclude = ".git|.tox|.venv|build|dist|.uv-cache|.ruff_cache"
skip-checking-short-docstrings = false
check-style-mismatch = true
check-arg-defaults = true
show-filenames-in-every-violation-message = true
check-class-attributes = false

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
